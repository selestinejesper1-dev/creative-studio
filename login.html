<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Aperture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="bg-scene" aria-hidden="true">
  <div class="bg-glow"></div>
  <svg class="bg-camera bg-camera-1" viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="20" y="42" width="200" height="88" rx="10"/>
    <rect x="96" y="18" width="46" height="26" rx="4"/>
    <circle cx="120" cy="88" r="36"/>
    <circle cx="120" cy="88" r="23"/>
    <circle cx="120" cy="88" r="9"/>
    <rect x="34" y="54" width="20" height="14" rx="2"/>
    <circle cx="196" cy="34" r="7"/>
    <circle cx="172" cy="30" r="9"/>
    <line x1="30" y1="42" x2="30" y2="30"/>
    <line x1="210" y1="42" x2="210" y2="30"/>
  </svg>
  <svg class="bg-camera bg-camera-2" viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="20" y="42" width="200" height="88" rx="10"/>
    <rect x="96" y="18" width="46" height="26" rx="4"/>
    <circle cx="120" cy="88" r="36"/>
    <circle cx="120" cy="88" r="23"/>
    <circle cx="120" cy="88" r="9"/>
    <rect x="34" y="54" width="20" height="14" rx="2"/>
    <circle cx="196" cy="34" r="7"/>
    <circle cx="172" cy="30" r="9"/>
    <line x1="30" y1="42" x2="30" y2="30"/>
    <line x1="210" y1="42" x2="210" y2="30"/>
  </svg>
  <div class="bg-grain"></div>
</div>


<header class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32"><circle class="iris-outer" cx="16" cy="16" r="13"/><circle class="iris-inner" cx="16" cy="16" r="4"/></svg>
      Aperture
    </a>
    <nav class="nav-links">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="dashboard.html" data-i18n="nav_curriculum">Curriculum</a>
      <a href="index.html#why" data-i18n="nav_about">About</a>
    </nav>
    <div class="nav-right">
      <div class="lang-switch"><select aria-label="Language"></select></div>
      <a href="signup.html" class="btn btn-primary" data-i18n="nav_signup">Start learning</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-visual">
    <div class="iris-wrap">
      <svg class="iris-svg" viewBox="0 0 400 400">
        <circle class="iris-ring-outer" cx="200" cy="200" r="160"/>
        <g>
          <g transform="rotate(0 200 200)"><path class="iris-blade" d="M200,200 L246,86 L222,60 L178,118 Z"/></g>
          <g transform="rotate(45 200 200)"><path class="iris-blade" d="M200,200 L246,86 L222,60 L178,118 Z"/></g>
          <g transform="rotate(90 200 200)"><path class="iris-blade" d="M200,200 L246,86 L222,60 L178,118 Z"/></g>
          <g transform="rotate(135 200 200)"><path class="iris-blade" d="M200,200 L246,86 L222,60 L178,118 Z"/></g>
          <g transform="rotate(180 200 200)"><path class="iris-blade" d="M200,200 L246,86 L222,60 L178,118 Z"/></g>
          <g transform="rotate(225 200 200)"><path class="iris-blade" d="M200,200 L246,86 L222,60 L178,118 Z"/></g>
          <g transform="rotate(270 200 200)"><path class="iris-blade" d="M200,200 L246,86 L222,60 L178,118 Z"/></g>
          <g transform="rotate(315 200 200)"><path class="iris-blade" d="M200,200 L246,86 L222,60 L178,118 Z"/></g>
        </g>
        <circle class="iris-center-glow" cx="200" cy="200" r="7"/>
      </svg>
    </div>
    <p class="auth-visual-caption" data-i18n="hero_sub">A complete photography curriculum — from your first press of the shutter to running a paid studio.</p>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <p class="eyebrow" data-i18n="login_eyebrow">Welcome back</p>
      <h1 data-i18n="login_title">Log in to your studio</h1>

      <div class="form-alert" data-form-alert></div>

      <form data-login-form novalidate>
        <div class="field">
          <label for="email" data-i18n="login_email">Email address</label>
          <input id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password" data-i18n="login_password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <div class="field-row">
          <label class="checkbox-row"><input type="checkbox" name="remember" /><span data-i18n="login_remember">Keep me logged in</span></label>
          <a href="#" class="link-muted" data-i18n="login_forgot">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="login_submit">Log in</button>
      </form>

      <p class="auth-switch">
        <span data-i18n="login_no_account">New to Aperture?</span>
        <a href="signup.html" data-i18n="login_create">Create an account</a>
      </p>

      <p class="demo-notice" data-i18n="form_demo_notice">Demo only — no account data leaves this browser tab.</p>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/main.js"></script>
</body>
</html>

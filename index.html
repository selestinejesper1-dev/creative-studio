<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeQuest — Learn to Code, Cross-Language</title>

<!-- Prism.js for syntax highlighting -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- In-browser JS sandbox execution needs nothing extra; Python runs via Pyodide (lazy-loaded) -->

<style>
  :root{
    --bg: #0d1117;
    --bg-raised: #12181f;
    --bg-card: #151b23;
    --border: #232b36;
    --border-soft: #1c232d;
    --text: #d8e0ea;
    --text-dim: #8b98a9;
    --text-faint: #5b6675;
    --accent: #39d98a;
    --accent-dim: #1f6b47;
    --accent-glow: rgba(57, 217, 138, 0.15);
    --amber: #e8b34a;
    --red: #e8615c;
    --blue: #5aa9e6;
    --purple: #b48ce8;
    --mono: 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 6px;
  }

  @font-face {
    font-family: 'JetBrains Mono';
    src: local('JetBrains Mono');
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  #root { min-height: 100vh; }

  ::selection { background: var(--accent-glow); color: var(--accent); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  a { color: inherit; text-decoration: none; }
  button { font-family: var(--sans); cursor: pointer; }
  code, pre, textarea.code-input { font-family: var(--mono); }

  /* ---------- Layout shell ---------- */
  .app-shell { display: flex; flex-direction: column; min-height: 100vh; }

  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-soft);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
  .brand .bracket { color: var(--accent); font-family: var(--mono); }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .nav-links { display: flex; gap: 4px; align-items: center; }
  .nav-links a, .nav-links button.navlink {
    background: none; border: none; color: var(--text-dim); font-size: 14px;
    padding: 8px 14px; border-radius: var(--radius); font-family: var(--sans);
    transition: all .15s ease;
  }
  .nav-links a:hover, .nav-links button.navlink:hover { color: var(--text); background: var(--bg-card); }
  .nav-links a.active, .nav-links button.navlink.active { color: var(--accent); background: var(--accent-glow); }

  .mobile-menu-btn { display: none; background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: var(--radius); }

  main.content { flex: 1; }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 28px; }

  /* ---------- Homepage hero ---------- */
  .hero {
    padding: 90px 28px 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(600px circle at 20% 20%, rgba(57,217,138,0.06), transparent 40%),
      radial-gradient(500px circle at 80% 30%, rgba(90,169,230,0.05), transparent 40%);
    pointer-events: none;
  }
  .hero-eyebrow {
    font-family: var(--mono); font-size: 13px; color: var(--accent);
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent-glow); padding: 6px 14px; border-radius: 999px;
    margin-bottom: 22px; border: 1px solid var(--accent-dim);
  }
  .hero h1 {
    font-size: clamp(36px, 6vw, 64px); font-weight: 800; letter-spacing: -0.03em;
    margin: 0 0 18px; line-height: 1.05;
  }
  .hero h1 .accent-text { color: var(--accent); }
  .hero p.sub {
    color: var(--text-dim); font-size: 18px; max-width: 620px; margin: 0 auto 36px;
    line-height: 1.6;
  }
  .hero-stats { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; margin-top: 50px; }
  .hero-stat { font-family: var(--mono); }
  .hero-stat .num { font-size: 28px; font-weight: 700; color: var(--text); }
  .hero-stat .label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }

  .section-heading {
    display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
    margin: 60px 0 24px; flex-wrap: wrap;
  }
  .section-heading h2 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .section-heading .section-tag { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }

  /* ---------- Language grid ---------- */
  .lang-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px; padding-bottom: 60px;
  }
  .lang-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 22px; position: relative; overflow: hidden;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    display: flex; flex-direction: column; gap: 14px;
  }
  .lang-card:hover {
    transform: translateY(-3px);
    border-color: var(--border-soft);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  .lang-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--lang-color, var(--accent));
  }
  .lang-card-top { display: flex; align-items: center; justify-content: space-between; }
  .lang-icon {
    width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; font-size: 18px;
    background: color-mix(in srgb, var(--lang-color, var(--accent)) 15%, transparent);
    color: var(--lang-color, var(--accent));
    border: 1px solid color-mix(in srgb, var(--lang-color, var(--accent)) 30%, transparent);
  }
  .diff-badge {
    font-size: 11px; font-family: var(--mono); padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
  }
  .diff-Beginner { background: rgba(57,217,138,0.12); color: var(--accent); }
  .diff-Intermediate { background: rgba(232,179,74,0.12); color: var(--amber); }
  .diff-Advanced { background: rgba(232,97,92,0.12); color: var(--red); }

  .lang-card h3 { margin: 0; font-size: 19px; font-weight: 700; }
  .lang-card p { margin: 0; color: var(--text-dim); font-size: 13.5px; line-height: 1.55; flex: 1; }
  .lang-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .lang-progress-track { flex: 1; height: 5px; background: var(--border-soft); border-radius: 4px; overflow: hidden; margin-right: 12px; }
  .lang-progress-fill { height: 100%; background: var(--lang-color, var(--accent)); border-radius: 4px; transition: width .3s ease; }
  .lang-progress-pct { font-family: var(--mono); font-size: 12px; color: var(--text-faint); white-space: nowrap; }

  /* ---------- Feature tiles on homepage ---------- */
  .feature-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 16px; margin-bottom: 40px; }
  .feature-tile {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 22px; cursor: pointer; transition: border-color .15s ease, transform .15s ease;
  }
  .feature-tile:hover { border-color: var(--accent-dim); transform: translateY(-2px); }
  .feature-tile .ft-icon { font-size: 22px; margin-bottom: 10px; }
  .feature-tile h4 { margin: 0 0 6px; font-size: 15.5px; }
  .feature-tile p { margin: 0; color: var(--text-dim); font-size: 13px; line-height: 1.5; }

  /* ---------- Track / module layout ---------- */
  .track-layout { display: flex; gap: 0; align-items: flex-start; }
  .sidebar {
    width: 270px; flex-shrink: 0; position: sticky; top: 65px;
    height: calc(100vh - 65px); overflow-y: auto;
    border-right: 1px solid var(--border-soft); padding: 24px 16px;
    background: var(--bg-raised);
  }
  .sidebar-header { padding: 0 10px 18px; }
  .sidebar-header .back-link { font-size: 12.5px; color: var(--text-faint); display: inline-flex; gap: 6px; align-items: center; margin-bottom: 14px; }
  .sidebar-header .back-link:hover { color: var(--text-dim); }
  .sidebar-lang-title { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .sidebar-lang-title h3 { margin: 0; font-size: 17px; }
  .sidebar-progress-label { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

  .module-list { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .module-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius);
    font-size: 13.5px; color: var(--text-dim); border: 1px solid transparent;
  }
  .module-item:hover { background: var(--bg-card); color: var(--text); }
  .module-item.active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent-dim); }
  .module-check {
    width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px;
  }
  .module-check.done { background: var(--accent); border-color: var(--accent); color: #06231a; }
  .module-num { font-family: var(--mono); font-size: 11px; color: var(--text-faint); width: 14px; }

  .track-main { flex: 1; min-width: 0; padding: 36px 44px 80px; }
  .track-main-narrow { max-width: 820px; }

  .module-header { margin-bottom: 28px; }
  .module-header .crumb { font-family: var(--mono); font-size: 12px; color: var(--text-faint); margin-bottom: 10px; }
  .module-header h1 { font-size: 30px; margin: 0 0 12px; letter-spacing: -0.02em; }
  .module-header .lede { color: var(--text-dim); font-size: 15.5px; line-height: 1.65; max-width: 700px; }

  .prose { color: var(--text-dim); font-size: 14.5px; line-height: 1.75; }
  .prose p { margin: 0 0 14px; }
  .prose ul { margin: 0 0 14px; padding-left: 20px; }
  .prose li { margin-bottom: 6px; }
  .prose strong { color: var(--text); }
  .prose code.inline { background: var(--bg-card); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; font-size: 13px; color: var(--accent); }

  .code-block-wrap { margin: 20px 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .code-block-header {
    display: flex; align-items: center; justify-content: space-between;
    background: #1a222c; padding: 9px 16px; font-family: var(--mono); font-size: 12px; color: var(--text-faint);
    border-bottom: 1px solid var(--border);
  }
  .code-block-header .dots { display: flex; gap: 6px; }
  .code-block-header .dots span { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .code-block-wrap pre { margin: 0 !important; border-radius: 0 !important; font-size: 13px !important; }
  .copy-btn { background: none; border: 1px solid var(--border); color: var(--text-faint); font-size: 11px; padding: 3px 10px; border-radius: 4px; font-family: var(--mono); }
  .copy-btn:hover { color: var(--text); border-color: var(--text-faint); }

  /* ---------- Editor / playground ---------- */
  .editor-panel { margin: 22px 0 32px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #0a0e13; }
  .editor-toolbar {
    display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
    background: #1a222c; border-bottom: 1px solid var(--border);
  }
  .editor-toolbar .et-label { font-family: var(--mono); font-size: 12px; color: var(--text-faint); display: flex; gap: 8px; align-items: center; }
  .run-btn {
    background: var(--accent); color: #06231a; border: none; font-weight: 700; font-size: 13px;
    padding: 7px 16px; border-radius: 6px; display: flex; align-items: center; gap: 6px;
    transition: background .15s ease;
  }
  .run-btn:hover { background: #4de89a; }
  .run-btn:disabled { background: var(--border); color: var(--text-faint); cursor: not-allowed; }
  .reset-btn {
    background: none; color: var(--text-faint); border: 1px solid var(--border); font-size: 12px;
    padding: 6px 12px; border-radius: 6px; margin-left: 8px;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--text-faint); }

  .editor-split { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 820px) { .editor-split { grid-template-columns: 1fr 1fr; } }

  textarea.code-input {
    width: 100%; min-height: 220px; background: #0a0e13; color: #d8e0ea; border: none; outline: none;
    padding: 16px; font-size: 13.5px; line-height: 1.6; resize: vertical; tab-size: 4;
    border-right: 1px solid var(--border);
  }
  .output-pane { padding: 16px; min-height: 220px; background: #080b0f; font-family: var(--mono); font-size: 13px; }
  .output-pane .ph { color: var(--text-faint); font-style: italic; }
  .output-line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
  .output-line.err { color: var(--red); }
  .output-line.log { color: var(--text); }
  .output-line.info { color: var(--text-faint); }

  /* ---------- Quiz ---------- */
  .quiz-box { margin: 32px 0; border: 1px solid var(--border); border-radius: 10px; padding: 26px; background: var(--bg-card); }
  .quiz-box h3 { margin: 0 0 4px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .quiz-box .quiz-sub { color: var(--text-faint); font-size: 13px; margin-bottom: 20px; }
  .quiz-q { margin-bottom: 22px; }
  .quiz-q .qtext { font-size: 14.5px; font-weight: 600; margin-bottom: 12px; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-option {
    text-align: left; background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-dim);
    padding: 11px 14px; border-radius: 8px; font-size: 13.5px; transition: all .12s ease;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--text-faint); color: var(--text); }
  .quiz-option.selected { border-color: var(--blue); background: rgba(90,169,230,0.08); }
  .quiz-option.correct { border-color: var(--accent); background: rgba(57,217,138,0.1); color: var(--accent); }
  .quiz-option.incorrect { border-color: var(--red); background: rgba(232,97,92,0.1); color: var(--red); }
  .quiz-option:disabled { cursor: default; }
  .quiz-result-banner {
    margin-top: 18px; padding: 14px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .quiz-result-banner.pass { background: rgba(57,217,138,0.1); color: var(--accent); border: 1px solid var(--accent-dim); }
  .quiz-result-banner.fail { background: rgba(232,179,74,0.1); color: var(--amber); border: 1px solid rgba(232,179,74,0.3); }

  .module-nav-footer {
    display: flex; align-items: center; justify-content: space-between; margin-top: 40px;
    padding-top: 24px; border-top: 1px solid var(--border-soft);
  }
  .nav-footer-btn {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 12px 18px;
    border-radius: 8px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; max-width: 45%;
  }
  .nav-footer-btn:hover { border-color: var(--accent-dim); }
  .nav-footer-btn .nf-label { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 2px; }
  .mark-complete-btn {
    background: var(--accent); color: #06231a; border: none; font-weight: 700; padding: 10px 20px; border-radius: 8px; font-size: 13.5px;
  }
  .mark-complete-btn.done { background: var(--bg-card); color: var(--accent); border: 1px solid var(--accent-dim); }

  /* ---------- Compare page ---------- */
  .compare-controls { display: flex; gap: 16px; align-items: center; margin-bottom: 30px; flex-wrap: wrap; }
  .compare-select-wrap { display: flex; flex-direction: column; gap: 6px; }
  .compare-select-wrap label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); font-family: var(--mono); }
  select.lang-select {
    background: var(--bg-card); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; font-family: var(--sans); min-width: 180px;
  }
  .compare-vs { font-family: var(--mono); color: var(--text-faint); font-size: 20px; margin-top: 18px; }
  .task-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
  .task-tab { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 14px; border-radius: 999px; font-size: 12.5px; }
  .task-tab.active { background: var(--accent-glow); border-color: var(--accent-dim); color: var(--accent); }
  .compare-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 760px) { .compare-grid { grid-template-columns: 1fr 1fr; } }
  .compare-col { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .compare-col-head { background: #1a222c; padding: 12px 16px; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }

  /* ---------- Cheat sheet ---------- */
  .cheat-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 40px; }
  table.cheat-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.cheat-table th {
    background: #1a222c; text-align: left; padding: 12px 16px; font-family: var(--mono); font-size: 12px;
    color: var(--text-dim); border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0;
  }
  table.cheat-table td { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); font-family: var(--mono); font-size: 12.5px; vertical-align: top; white-space: nowrap; }
  table.cheat-table tr:hover td { background: var(--bg-card); }
  table.cheat-table td:first-child { font-family: var(--sans); font-weight: 600; color: var(--text); white-space: normal; min-width: 140px; }

  /* ---------- Sandbox page ---------- */
  .sandbox-lang-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .sandbox-lang-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .sandbox-lang-btn.active { border-color: var(--lang-color); color: var(--lang-color); background: color-mix(in srgb, var(--lang-color) 12%, transparent); }

  /* ---------- Footer ---------- */
  footer.site-footer { border-top: 1px solid var(--border-soft); padding: 30px 28px; text-align: center; color: var(--text-faint); font-size: 12.5px; }

  /* ---------- misc ---------- */
  .pill { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-faint); }
  .empty-note { color: var(--text-faint); font-size: 13.5px; padding: 40px 0; text-align: center; }

  .mobile-sidebar-toggle {
    display: none; position: fixed; bottom: 20px; right: 20px; z-index: 60;
    background: var(--accent); color: #06231a; border: none; width: 50px; height: 50px; border-radius: 50%;
    font-size: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  @media (max-width: 860px) {
    .nav-links { display: none; }
    .mobile-menu-btn { display: block; }
    .track-layout { flex-direction: column; }
    .sidebar {
      position: fixed; left: -300px; top: 0; height: 100vh; z-index: 55; width: 280px;

const STORAGE_KEY = 'codequest_progress_v1';

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveProgress(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { /* ignore quota errors */ }
}

function useProgress() {
  const [progress, setProgress] = useState(loadProgress);

  const markComplete = useCallback((langId, moduleName, done) => {
    setProgress(prev => {
      const next = { ...prev };
      next[langId] = { ...(next[langId] || {}) };
      next[langId][moduleName] = done;
      saveProgress(next);
      return next;
    });
  }, []);

  const isDone = useCallback((langId, moduleName) => {
    return !!(progress[langId] && progress[langId][moduleName]);
  }, [progress]);

  const langPct = useCallback((langId) => {
    const done = MODULE_TEMPLATE.filter(m => isDone(langId, m)).length;
    return Math.round((done / MODULE_TEMPLATE.length) * 100);
  }, [isDone]);

  const totalPct = useMemo(() => {
    const totalModules = LANGUAGES.length * MODULE_TEMPLATE.length;
    let done = 0;
    LANGUAGES.forEach(l => MODULE_TEMPLATE.forEach(m => { if (isDone(l.id, m)) done++; }));
    return Math.round((done / totalModules) * 100);
  }, [isDone]);

  return { progress, markComplete, isDone, langPct, totalPct };
}

// JS: run in a sandboxed iframe-free way by overriding console within a Function scope
function runJavaScript(code) {
  const logs = [];
  const fakeConsole = {
    log: (...args) => logs.push({ type: 'log', text: args.map(stringifyArg).join(' ') }),
    error: (...args) => logs.push({ type: 'err', text: args.map(stringifyArg).join(' ') }),
    warn: (...args) => logs.push({ type: 'log', text: args.map(stringifyArg).join(' ') }),
    info: (...args) => logs.push({ type: 'log', text: args.map(stringifyArg).join(' ') }),
  };
  try {
    const fn = new Function('console', code);
    fn(fakeConsole);
  } catch (err) {
    logs.push({ type: 'err', text: (err && err.message) ? err.message : String(err) });
  }
  return logs;
}

function stringifyArg(a) {
  if (typeof a === 'object') {
    try { return JSON.stringify(a); } catch (e) { return String(a); }
  }
  return String(a);
}

// Python: lazy-load Pyodide from CDN on first use
let pyodideInstance = null;
let pyodideLoading = null;

function loadPyodide_() {
  if (pyodideInstance) return Promise.resolve(pyodideInstance);
  if (pyodideLoading) return pyodideLoading;

  pyodideLoading = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js';
    script.onload = async () => {
      try {
        const py = await window.loadPyodide();
        pyodideInstance = py;
        resolve(py);
      } catch (e) { reject(e); }
    };
    script.onerror = () => reject(new Error('Failed to load Python runtime'));
    document.body.appendChild(script);
  });
  return pyodideLoading;
}

async function runPython(code) {
  const logs = [];
  try {
    const py = await loadPyodide_();
    py.setStdout({ batched: (s) => logs.push({ type: 'log', text: s }) });
    py.setStderr({ batched: (s) => logs.push({ type: 'err', text: s }) });
    await py.runPythonAsync(code);
  } catch (err) {
    logs.push({ type: 'err', text: (err && err.message) ? err.message : String(err) });
  }
  return logs;
}

// Other languages: no client-side compiler available. We show an informative
// simulated-output note rather than pretending to execute.
function unsupportedRuntimeNote(langName) {
  return [
    { type: 'info', text: `${langName} can't be compiled directly in the browser.` },
    { type: 'info', text: `Read the code carefully and predict the output — that's the exercise!` },
    { type: 'info', text: `For real execution, try running this locally or on an online compiler (e.g. replit.com, godbolt.org, or the Go Playground).` },
  ];
}

function InteractiveEditor({ langId, initialCode }) {
  const [code, setCode] = useState(initialCode);
  const [output, setOutput] = useState(null);
  const [running, setRunning] = useState(false);
  const langInfo = LANG_MAP[langId];
  const runnable = RUNNABLE_LANGS.has(langId);

  const handleRun = async () => {
    setRunning(true);
    setOutput(null);
    if (langId === 'javascript') {
      const logs = runJavaScript(code);
      setOutput(logs);
      setRunning(false);
    } else if (langId === 'python') {
      setOutput([{ type: 'info', text: 'Starting Python runtime (first run may take a few seconds)...' }]);
      const logs = await runPython(code);
      setOutput(logs);
      setRunning(false);
    } else {
      setOutput(unsupportedRuntimeNote(langInfo.name));
      setRunning(false);
    }
  };

  const handleReset = () => {
    setCode(initialCode);
    setOutput(null);
  };

  return (
    <div className="editor-panel">
      <div className="editor-toolbar">

function Quiz({ questions, onComplete, storageKeySuffix }) {
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);

  const selectAnswer = (qIdx, optIdx) => {
    if (submitted) return;
    setAnswers(prev => ({ ...prev, [qIdx]: optIdx }));
  };

  const handleSubmit = () => {
    setSubmitted(true);
    const correctCount = questions.filter((q, i) => answers[i] === q.correct).length;
    onComplete && onComplete(correctCount, questions.length);
  };

  const allAnswered = questions.every((q, i) => answers[i] !== undefined);
  const correctCount = submitted ? questions.filter((q, i) => answers[i] === q.correct).length : 0;
  const passed = submitted && correctCount === questions.length;

  return (
    <div className="quiz-box">
      <h3><Icon name="target" size={16} /> Knowledge Check</h3>
      <div className="quiz-sub">Answer all {questions.length} questions to mark this module complete.</div>
      {questions.map((q, qi) => (
        <div className="quiz-q" key={qi}>
          <div className="qtext">{qi + 1}. {q.q}</div>
          <div className="quiz-options">
            {q.options.map((opt, oi) => {
              let cls = 'quiz-option';
              if (submitted) {
                if (oi === q.correct) cls += ' correct';
                else if (answers[qi] === oi) cls += ' incorrect';
              } else if (answers[qi] === oi) {
                cls += ' selected';
              }
              return (
                <button key={oi} className={cls} disabled={submitted} onClick={() => selectAnswer(qi, oi)}>
                  {opt}
                </button>
              );
            })}
          </div>
        </div>
      ))}
      {!submitted && (
        <button className="run-btn" style={{ opacity: allAnswered ? 1 : 0.5 }} disabled={!allAnswered} onClick={handleSubmit}>
          Submit Answers
        </button>
      )}
      {submitted && (
        <div className={`quiz-result-banner ${passed ? 'pass' : 'fail'}`}>
          <span>{passed ? `Perfect score — ${correctCount}/${questions.length}!` : `You scored ${correctCount}/${questions.length}. Review the highlighted answers above.`}</span>
          {!passed && <button className="reset-btn" onClick={() => { setSubmitted(false); setAnswers({}); }}>Try Again</button>}
        </div>
      )}
    </div>
  );
}

// Very small markdown-ish renderer: supports **bold**, `code`, and bullet lists (- item), paragraphs
function MarkdownLite({ text }) {
  const blocks = text.trim().split(/\n\n+/);
  return (
    <div className="prose">
      {blocks.map((block, bi) => {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        const isList = lines.every(l => l.startsWith('- '));
        if (isList) {
          return (
            <ul key={bi}>
              {lines.map((l, li) => <li key={li}>{renderInline(l.slice(2))}</li>)}
            </ul>
          );
        }
        return <p key={bi}>{renderInline(block)}</p>;
      })}
    </div>
  );
}

function renderInline(str) {
  // split on **bold** and `code`
  const parts = [];
  let remaining = str;
  const regex = /(\*\*[^*]+\*\*|`[^`]+`)/g;
  let lastIndex = 0;
  let match;
  let key = 0;
  while ((match = regex.exec(str)) !== null) {
    if (match.index > lastIndex) parts.push(str.slice(lastIndex, match.index));
    const token = match[0];
    if (token.startsWith('**')) {
      parts.push(<strong key={key++}>{token.slice(2, -2)}</strong>);
    } else {
      parts.push(<code className="inline" key={key++}>{token.slice(1, -1)}</code>);
    }
    lastIndex = match.index + token.length;
  }
  if (lastIndex < str.length) parts.push(str.slice(lastIndex));
  return parts;
}

function parseHash() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  if (parts.length === 0) return { page: 'home' };
  if (parts[0] === 'track') return { page: 'track', lang: parts[1] || 'python', module: parts[2] ? decodeURIComponent(parts[2]) : undefined };
  if (parts[0] === 'compare') return { page: 'compare' };
  if (parts[0] === 'cheatsheet') return { page: 'cheatsheet' };
  if (parts[0] === 'sandbox') return { page: 'sandbox' };
  return { page: 'home' };
}

function routeToHash(route) {
  if (route.page === 'home') return '#/';
  if (route.page === 'track') return `#/track/${route.lang}${route.module ? '/' + encodeURIComponent(route.module) : ''}`;
  if (route.page === 'compare') return '#/compare';
  if (route.page === 'cheatsheet') return '#/cheatsheet';
  if (route.page === 'sandbox') return '#/sandbox';
  return '#/';
}

function App() {
  const [route, setRoute] = useState(parseHash());
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const progressApi = useProgress();

  useEffect(() => {
    const onHashChange = () => setRoute(parseHash());
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  const navigate = useCallback((newRoute) => {
    window.location.hash = routeToHash(newRoute);
    setRoute(newRoute);
    setSidebarOpen(false);
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }, []);

  const navItems = [
    { key: 'home', label: 'Home', route: { page: 'home' } },
    { key: 'compare', label: 'Compare', route: { page: 'compare' } },
    { key: 'cheatsheet', label: 'Cheat Sheet', route: { page: 'cheatsheet' } },
    { key: 'sandbox', label: 'Sandbox', route: { page: 'sandbox' } },
  ];

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand" onClick={() => navigate({ page: 'home' })} style={{ cursor: 'pointer' }}>
          <span className="dot"></span>
          <span><span className="bracket">{'<'}</span>CodeQuest<span className="bracket">{'/>'}</span></span>
        </div>
        <div className="nav-links">
          {navItems.map(item => (
            <button
              key={item.key}
              className={`navlink ${route.page === item.route.page ? 'active' : ''}`}
              onClick={() => navigate(item.route)}
            >
              {item.label}
            </button>
          ))}
        </div>
        <button className="mobile-menu-btn" onClick={() => setSidebarOpen(o => !o)}><Icon name="menu" size={16} /></button>
      </div>

      {route.page !== 'track' && sidebarOpen && (
        <div className="nav-links" style={{ display: 'flex', flexDirection: 'column', padding: '10px 16px', borderBottom: '1px solid var(--border-soft)' }}>
          {navItems.map(item => (
            <button key={item.key} className="navlink" style={{ textAlign: 'left' }} onClick={() => { navigate(item.route); setSidebarOpen(false); }}>
              {item.label}
            </button>
          ))}
        </div>
      )}

      <main className="content">
        {route.page === 'home' && <HomePage navigate={navigate} progressApi={progressApi} />}
        {route.page === 'track' && (
          <TrackPage
            langId={route.lang}
            moduleName={route.module}
            navigate={navigate}
            progressApi={progressApi}
            sidebarOpen={sidebarOpen}
            setSidebarOpen={setSidebarOpen}
          />
        )}
        {route.page === 'compare' && <ComparePage />}
        {route.page === 'cheatsheet' && <CheatSheetPage />}
        {route.page === 'sandbox' && <SandboxPage />}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
